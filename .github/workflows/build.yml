name: Build Static Binaries

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
            cxx: g++
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libminiupnpc-dev
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libminiupnpc-dev:arm64 || true
          fi

      - name: Build (static)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build build --target raknet_proxy -j$(nproc)

      - name: Verify static binary
        run: |
          file build/raknet_proxy
          ldd build/raknet_proxy 2>&1 | grep -E "static|not a dynamic" || echo "Note: libc may be dynamically linked"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raknet_proxy-linux-${{ matrix.arch }}
          path: build/raknet_proxy

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build (MSVC static CRT)
        shell: cmd
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --target raknet_proxy --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Verify binary
        shell: pwsh
        run: |
          if (Test-Path "build/Release/raknet_proxy.exe") {
            Write-Host "Binary exists: build/Release/raknet_proxy.exe"
          } else {
            Write-Host "Binary exists: build/raknet_proxy.exe"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raknet_proxy-windows-amd64
          path: |
            build/Release/raknet_proxy.exe
            build/raknet_proxy.exe

  build-macos:
    runs-on: macos-13
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_C_FLAGS="-D_DARWIN_C_SOURCE" \
            -DCMAKE_CXX_FLAGS="-D_DARWIN_C_SOURCE"
          cmake --build build --target raknet_proxy -j$(sysctl -n hw.ncpu)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raknet_proxy-macos-${{ matrix.arch }}
          path: build/raknet_proxy

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/raknet_proxy-linux-amd64/raknet_proxy artifacts/raknet_proxy-linux-amd64
          mv artifacts/raknet_proxy-linux-arm64/raknet_proxy artifacts/raknet_proxy-linux-arm64
          mv artifacts/raknet_proxy-windows-amd64/raknet_proxy.exe artifacts/raknet_proxy-windows-amd64.exe 2>/dev/null || mv artifacts/raknet_proxy-windows-amd64/Release/raknet_proxy.exe artifacts/raknet_proxy-windows-amd64.exe 2>/dev/null || true
          mv artifacts/raknet_proxy-macos-x86_64/raknet_proxy artifacts/raknet_proxy-macos-x86_64
          mv artifacts/raknet_proxy-macos-arm64/raknet_proxy artifacts/raknet_proxy-macos-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/raknet_proxy-linux-amd64
            artifacts/raknet_proxy-linux-arm64
            artifacts/raknet_proxy-windows-amd64.exe
            artifacts/raknet_proxy-macos-x86_64
            artifacts/raknet_proxy-macos-arm64
          generate_release_notes: true
